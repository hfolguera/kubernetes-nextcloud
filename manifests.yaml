# Source: nextcloud/templates/metrics/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-metrics
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/instance: nextcloud
    app.kubernetes.io/component: metrics
    helm.sh/chart: nextcloud-9.4.1
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "35.0.2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
      app.kubernetes.io/instance: nextcloud
      app.kubernetes.io/component: metrics
  template:
    metadata:
      annotations:
        {}
      labels:
        app.kubernetes.io/name: nextcloud
        app.kubernetes.io/instance: nextcloud
        app.kubernetes.io/component: metrics
    spec:
      containers:
        - name: metrics-exporter
          image: "docker.io/xperimental/nextcloud-exporter:0.9.1"
          imagePullPolicy: IfNotPresent
          env:
            - name: NEXTCLOUD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: nextcloud-username
            - name: NEXTCLOUD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: nextcloud-password
            # NEXTCLOUD_SERVER is used by metrics-exporter to reach the Nextcloud (K8s-)Service to grab the serverinfo api endpoint
            - name: NEXTCLOUD_SERVER # deployment.namespace.svc.cluster.local
              value: "http://nextcloud.default.svc.cluster.local:8080"
            - name: NEXTCLOUD_TIMEOUT
              value: 5s
            - name: NEXTCLOUD_TLS_SKIP_VERIFY
              value: "false"
            - name: NEXTCLOUD_INFO_APPS
              value: "false"
            - name: NEXTCLOUD_INFO_UPDATE
              value: "false"
          ports:
            - name: metrics
              containerPort: 9205
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
